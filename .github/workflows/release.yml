name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Open Task Manager ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Versionless copies of every installer, so these links never change and always give
      # the newest release (the website and README use them):
      #   https://github.com/sabaoongfx/Open-Task-Manager/releases/latest/download/<name>
      # Plus Open-Task-Manager-<version>-x86_64.AppImage, the naming the AppImage catalog
      # (appimage.github.io) looks for.
      - name: Upload versionless copies
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          mkdir stable
          # copy <glob> <name>: the single bundle file matching glob, as stable/<name>
          copy() { cp "$(ls $1 | head -n 1)" "stable/$2"; }
          case "$RUNNER_OS" in
            Linux)
              b=target/release/bundle
              copy "$b/appimage/*.AppImage" Open-Task-Manager-x86_64.AppImage
              copy "$b/appimage/*.AppImage" "Open-Task-Manager-${GITHUB_REF_NAME#v}-x86_64.AppImage"
              copy "$b/deb/*.deb" Open-Task-Manager-amd64.deb
              copy "$b/rpm/*.rpm" Open-Task-Manager-x86_64.rpm
              ;;
            Windows)
              b=target/release/bundle
              copy "$b/nsis/*-setup.exe" Open-Task-Manager-x64-setup.exe
              copy "$b/msi/*.msi" Open-Task-Manager-x64.msi
              ;;
            macOS)
              triple="${ARGS#--target }"   # e.g. aarch64-apple-darwin
              arch=$([ "$triple" = aarch64-apple-darwin ] && echo aarch64 || echo x64)
              copy "target/$triple/release/bundle/dmg/*.dmg" "Open-Task-Manager-$arch.dmg"
              ;;
          esac
          gh release upload "$GITHUB_REF_NAME" stable/* --clobber

  # Standalone terminal UI (`otm`) archives, attached to the draft release created above.
  publish-tui:
    needs: publish-tauri
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: tui-${{ matrix.target }}

      - name: Build otm
        run: cargo build --release --locked -p otm --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="otm-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/otm" LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          cp "$name.tar.gz" "otm-${{ matrix.target }}.tar.gz"   # versionless: stable download link
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          echo "STABLE_ASSET=otm-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "otm-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/otm.exe", LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          Copy-Item "$name.zip" "otm-${{ matrix.target }}.zip"   # versionless: stable download link
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STABLE_ASSET=otm-${{ matrix.target }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET" "$STABLE_ASSET" --clobber
